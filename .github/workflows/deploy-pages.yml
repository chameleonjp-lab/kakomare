name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run static and unit checks
        run: npm run lint && npm run typecheck && npm run test && npm run verify:expansion-docs && npm run verify:ranking-manifest
      - name: Run Chromium checks
        run: npm run test:e2e:chromium
      - name: Run WebKit checks
        run: npm run test:e2e:webkit
      - name: Build and verify release files
        run: npm run build && npm run verify:dist && npm run verify:originality
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check this is still the production branch head
        id: current
        uses: actions/github-script@v7
        with:
          script: |
            const ref = await github.rest.git.getRef({
              ...context.repo, ref: 'heads/main'
            });
            core.setOutput('current', ref.data.object.sha === context.sha);
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.current.outputs.current == 'true'
        uses: actions/deploy-pages@v5

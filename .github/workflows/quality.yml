name: Quality

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run static and unit checks
        run: npm run lint && npm run typecheck && npm run test
      - name: Run Chromium checks
        run: npm run test:e2e:chromium
      - name: Run WebKit checks
        run: npm run test:e2e:webkit
      - name: Build and verify release files
        run: npm run build && npm run verify:dist && npm run verify:originality

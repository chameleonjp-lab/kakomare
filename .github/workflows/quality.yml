name: Quality

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Playwright browsers
        run: npx playwright install --list
      - name: Run static and unit checks
        run: npm run lint && npm run typecheck && npm run test && npm run verify:expansion-docs && npm run verify:ranking-manifest && git diff --check
      - name: Run Chromium checks
        run: npm run test:e2e:chromium
      - name: Run WebKit checks
        run: npm run test:e2e:webkit
      - name: Build and verify release files
        run: npm run build && npm run verify:dist && npm run verify:originality

  # Pages builds on the native runner, whose fonts/rendering can differ from
  # the Playwright container. Exercise that environment before merging too.
  pages-runner-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run static and unit checks
        run: npm run lint && npm run typecheck && npm run test && npm run verify:expansion-docs && npm run verify:ranking-manifest && git diff --check
      - name: Run Chromium checks
        run: npm run test:e2e:chromium
      - name: Run WebKit checks
        run: npm run test:e2e:webkit
      - name: Build and verify release files
        run: npm run build && npm run verify:dist && npm run verify:originality

  # The V7 matrix uses the production BattleScene update path for 720 normal
  # and 60 endless observations. Keep it separate so the ordinary quality
  # jobs do not run the long final-gate suite twice.
  v7-final-gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run V7 final battle gates
        run: npm run test:v7 -- --testTimeout=900000
